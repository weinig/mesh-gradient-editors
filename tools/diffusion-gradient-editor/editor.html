<body>
<main>
    <nav id="toolbar" aria-label="Tools">
        <button data-tool="select" title="Select" aria-label="Select"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-5.5 1.2L16 19.5l-2.4 1.2-3-6.3L6 18z" fill="currentColor"/></svg></button>
        <button data-tool="pen" title="Pen" aria-label="Pen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l5 9-5 9-5-9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg></button>
        <button data-tool="line" title="Straight line" aria-label="Straight line"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button data-tool="ellipse" title="Ellipse" aria-label="Ellipse"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="8" ry="6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
        <button data-tool="arc" title="Arc" aria-label="Arc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button data-tool="freehand" title="Freehand" aria-label="Freehand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16c3-7 5 3 8-3s5-6 8 1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <div id="newColors" title="The colors of new curves: left, or inside, above; right, or outside, below">
            <input id="newFirst" type="color" alpha aria-label="New curves' left or inside color">
            <input id="newSecond" type="color" alpha aria-label="New curves' right or outside color">
            <button id="swapNewColors" title="Swap" aria-label="Swap the new curves' colors">⇅</button>
        </div>
        <button id="undo" title="Undo (⌘Z)" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7L4 12l5 5M4 12h10a5 5 0 0 1 0 10h-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -3)"/></svg></button>
        <button id="redo" title="Redo (⇧⌘Z)" aria-label="Redo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7l5 5-5 5M20 12H10a5 5 0 0 0 0 10h2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -3)"/></svg></button>
    </nav>
{{PAGE}}
        <section id="curves">
            <div class="heading">
                <h2 id="curvesTitle">Curves</h2>
                <button class="info" aria-controls="curvesNotes" title="About drawing curves" aria-label="About drawing curves" aria-expanded="false"></button>
            </div>
            <div id="curveFields">
                <div class="row">
                    <label id="firstColorLabel" for="firstText"></label>
                    <input id="firstColor" type="color" alpha title="Pick an sRGB color and its opacity">
                    <input id="firstText" class="colorText" type="text" spellcheck="false" title="Any CSS color, with alpha. Missing (none) components are 0 for now.">
                </div>
                <div class="row">
                    <label id="secondColorLabel" for="secondText"></label>
                    <input id="secondColor" type="color" alpha title="Pick an sRGB color and its opacity">
                    <input id="secondText" class="colorText" type="text" spellcheck="false" title="Any CSS color, with alpha. Missing (none) components are 0 for now.">
                </div>
                <div id="shapeFields"></div>
                <div class="row" title="How firmly the curve holds its colors. Below 100%, the colors around it bleed in.">
                    <label for="strength">Strength</label>
                    <input id="strength" type="range" min="0" max="100" step="1">
                    <output id="strengthValue"></output>
                </div>
                <div class="row" title="How wide a band the jump between the curve's two colors is softened over.">
                    <label for="blur">Blur</label>
                    <input id="blur" type="range" min="0" max="100" step="1">
                    <output id="blurValue"></output>
                </div>
                <div class="row" title="A curve holds its colors across a band either side of it, which also holds the surface flat there. With a free slope it holds only the texel either side of it, so the biharmonic model's surface keeps its slope through the curve, as a tear in Finch et al.'s paper does. That can run far past the curve's colors, most of all for an open curve. A blurred curve has none, and the harmonic model has no slope to hold.">
                    <label><input type="checkbox" id="free"> Free slope</label>
                </div>
                <div id="toPathRow" class="row" title="Turn the shape into a path of nodes, to shape it freely. It can't be turned back.">
                    <button id="toPath" class="small">Convert to a path</button>
                </div>
            </div>
            <div id="curveList"></div>
            <div class="row"><button id="clearCurves" class="small">Remove all curves</button></div>
            <p id="emptyNote" class="note">No curves. Draw some with the tools on the left.</p>
            <div id="curvesNotes" hidden>
                <p id="toolNote" class="note"></p>
                <p class="note">Each curve holds a color on each side. For a closed curve, that's inside and outside.</p>
            </div>
        </section>


{{VISUALIZE}}
{{CSS}}    </aside>
</main>
