    <div id="stageScroller">
        <div id="topBar">
            <div id="modelBar" role="group" aria-label="Models">
{{MODEL_BUTTONS}}            </div>
            <button id="aboutButton" title="Show how each model works, its pros and cons, where it comes from, and what a spec would need, under each box.">About the models</button>
        </div>
        <div id="views">
{{VIEWS}}        </div>
    </div>
    <aside>
        <section>
            <h1>{{TITLE}}</h1>
            <div class="row">
                <label for="preset">Preset</label>
                <select id="preset"></select>
                <button id="presetInfo" class="info" aria-controls="presetNotes" title="About this preset" aria-label="About this preset" aria-expanded="false"></button>
            </div>
            <div id="presetNotes" hidden>
                <p id="presetNote" class="note"></p>
            </div>
            <div class="row">
                <label>Box</label>
                <input id="width" type="number" min="100" max="2000" step="10" title="Width"> ×
                <input id="height" type="number" min="100" max="2000" step="10" title="Height"> px
            </div>
            <div class="row">
                <label for="space">Interpolate in</label>
                <select id="space"></select>
            </div>
            <div class="row" title="Colors outside the screen's gamut are clipped, as WebKit does, or gamut mapped as CSS Color 4 says.">
                <label for="gamutMapping">Out of gamut</label>
                <select id="gamutMapping">
                    <option value="clip">Clip</option>
                    <option value="map">Gamut map (CSS Color 4)</option>
                </select>
            </div>
            <div class="row" title="What is drawn behind the boxes, showing through wherever the gradient is transparent. It isn't part of the gradient.">
                <label for="backdrop">Backdrop</label>
                <select id="backdrop">
                    <option value="checkerboard">Checkerboard</option>
                    <option value="none">None</option>
                    <option value="puppy">Puppy</option>
                    <option value="image">Image</option>
                </select>
                <span id="backdropImageName" class="note"></span>
                <button id="chooseBackdropImage" class="small" title="Choose an image, or drop one on a box">Choose…</button>
                <input id="backdropFile" type="file" accept="image/*" hidden>
            </div>
            <div class="row">
                <label><input type="checkbox" id="{{SHOW_ID}}" checked> {{SHOW_LABEL}}</label>
            </div>
{{MORE_SETTINGS}}            <div class="row" title="How many texels the grid has along its longer side, at most. The grid is never finer than the box's pixels.">
                <label for="resolution">Grid</label>
                <select id="resolution">
                    <option value="128">128</option>
                    <option value="256">256</option>
                    <option value="512">512</option>
                    <option value="1024">1024</option>
                </select>
                <span class="note">texels on the longer side</span>
            </div>
            <div class="row" title="The grid while you drag or move a slider. A smaller one solves faster, but a stop or curve held by a few texels comes out a little different on it, so the gradient shifts as the drag starts and settles back when it ends.">
                <label for="editing">While editing</label>
                <select id="editing">
                    <option value="full">The same grid</option>
                    <option value="half">Half the grid</option>
                    <option value="quarter">A quarter of the grid</option>
                </select>
            </div>
            <div class="row" title="Mirrored: the grid is exactly the box, and the surface meets each side flat, as if a mirror stood there. Open: the grid reaches half the box's size past each side, so its edges are far from the stops, and its texels are bigger as a result. Natural: nothing holds the surface at the box's sides, so the biharmonic model keeps its slope there, and goes further past its colors; the harmonic model is as with Mirrored.">
                <label for="edges">Edges</label>
                <select id="edges">
                    <option value="mirrored">Mirrored</option>
                    <option value="open">Open</option>
                    <option value="natural">Natural</option>
{{MORE_EDGES}}                </select>
            </div>
            <div id="edgeStripsRow" class="row" title="A two-sided curve's jump is held across a couple of texels, which filtering up to the screen would blur. Strips along it, drawn over the gradient at the screen's resolution, keep it sharp. As the grid solves them shows the solve alone.">
                <label for="edgeStrips">Curve edges</label>
                <select id="edgeStrips">
                    <option value="sharp">Sharp at the screen's resolution</option>
                    <option value="solved">As the grid solves them</option>
                </select>
            </div>
{{MORE_GRID}}            <p id="gpuStatus" class="status"></p>
        </section>
