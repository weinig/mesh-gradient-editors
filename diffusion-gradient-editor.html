<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diffusion Gradient Editor</title>
<style>
:root {
    color-scheme: light dark;
    --bg: #f2f2f5;
    --panel: #ffffff;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #0a84ff;
    --error: #d70015;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #1c1c1e;
        --panel: #2c2c2e;
        --fg: #f5f5f7;
        --muted: #a1a1a6;
        --border: #48484a;
        --error: #ff6961;
    }
}
* { box-sizing: border-box; }
body {
    margin: 0;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
}
main {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 16px;
    align-items: flex-start;
}
#stageScroller {
    flex: 1 1 560px;
    min-width: 0;
    height: calc(100vh - 32px);
    position: sticky;
    top: 16px;
    overflow: auto;
}
#stageWrap {
    width: max-content;
}
#stage {
    position: relative;
    outline: 1px solid var(--border);
}
#stage.checkerboard {
    background-color: #fff;
    background-image: conic-gradient(#ddd 0 25%, #fff 0 50%, #ddd 0 75%, #fff 0);
    background-size: 16px 16px;
}
#stage.image {
    background-position: center;
    background-size: cover;
}
#stageScroller.dropTarget { outline: 2px dashed var(--accent); outline-offset: -2px; }
#native, #gpu {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}
#overlay {
    position: absolute;
    touch-action: none;
}
#stageMessage {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    color: #333;
    background: rgba(255, 255, 255, 0.85);
    font-size: 14px;
}
aside {
    flex: 0 0 380px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
}
h1 { font-size: 17px; margin: 0 0 4px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 8px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
.row > label { min-width: 84px; color: var(--muted); }
input[type=number] { width: 64px; }
input[type=text], select, textarea { font: inherit; }
input[type=text] { flex: 1; min-width: 0; font-family: ui-monospace, Menlo, monospace; }
input[type=text].invalid { outline: 2px solid var(--error); }
textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    font: 12px/1.4 ui-monospace, Menlo, monospace;
}
.note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
.status { font-size: 12px; margin: 4px 0 0; }
.status.error { color: var(--error); }
#swatches {
    display: grid;
    gap: 4px;
    margin-top: 8px;
}
#swatches button {
    height: 26px;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0;
    cursor: pointer;
    background-image: conic-gradient(#ccc 0 25%, #fff 0 50%, #ccc 0 75%, #fff 0);
    background-size: 8px 8px;
    position: relative;
}
#swatches button span { position: absolute; inset: 0; border-radius: 4px; }
#swatches button.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
button.small { font-size: 12px; }
@media (max-width: 720px) {
    main { padding: 8px; gap: 8px; }
    #stageScroller { flex: 1 1 100%; height: auto; position: static; overflow: hidden; }
    #stageWrap { transform-origin: 0 0; }
    aside { flex: 1 1 100%; min-width: 0; }
    /* iOS zooms into fields with text smaller than 16px when they are focused. */
    input, select, textarea { font-size: 16px; }
}
#topBar {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 12px;
}
#modelBar { display: flex; }
#modelBar button {
    font: inherit;
    padding: 5px 14px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--fg);
    cursor: pointer;
}
#modelBar button + button { border-left: none; }
#modelBar button:first-child { border-radius: 6px 0 0 6px; }
#modelBar button:last-child { border-radius: 0 6px 6px 0; }
#modelBar button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
#views {
    display: flex;
    gap: 16px;
    align-items: flex-start;
}
.view { margin: 0; flex: 1 1 0; min-width: 0; }
.view[hidden] { display: none; }
.stage {
    position: relative;
    width: 100%;
    outline: 1px solid var(--border);
    background-color: #fff;
    background-image: conic-gradient(#ddd 0 25%, #fff 0 50%, #ddd 0 75%, #fff 0);
    background-size: 16px 16px;
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage .overlay { touch-action: none; }
.view figcaption { font-size: 12px; margin-top: 6px; }
.view figcaption .note { display: block; margin-top: 2px; }
#curveList { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
#curveList .curve { display: flex; align-items: center; gap: 8px; }
#curveList .curve { padding: 2px 4px; border-radius: 4px; cursor: pointer; }
#curveList .curve.selected { background: color-mix(in srgb, var(--accent) 18%, transparent); }
#curveList .curve span { flex: 1; }
#curveList input[type=color] { width: 32px; height: 22px; padding: 0; border: 1px solid var(--border); border-radius: 4px; }
#toolbar {
    flex: none;
    position: sticky;
    top: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
}
#toolbar button[data-tool] {
    width: 34px;
    height: 34px;
    padding: 5px;
    border: none;
    border-radius: 6px;
    background: none;
    color: var(--fg);
    cursor: pointer;
}
#toolbar button[data-tool]:hover { background: color-mix(in srgb, var(--fg) 10%, transparent); }
#toolbar button[data-tool][aria-pressed=true] { background: var(--accent); color: #fff; }
#toolbar svg { width: 24px; height: 24px; display: block; }
#newColors { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--border); }
#newColors input[type=color] { width: 30px; height: 22px; padding: 0; border: 1px solid var(--border); border-radius: 4px; }
#swapNewColors { font: inherit; font-size: 12px; padding: 0 6px; border: none; background: none; color: var(--fg); cursor: pointer; }
@media (max-width: 720px) {
    #toolbar { flex-direction: row; flex-wrap: wrap; position: static; flex: 1 1 100%; }
    #newColors { flex-direction: row; margin: 0 0 0 6px; padding: 0 0 0 8px; border-top: none; border-left: 1px solid var(--border); }
    #views { flex-direction: column; }
    .view { flex: none; width: 100%; }
}
#selectedCurve[hidden] { display: none; }
#selectedCurve input[type=range] { flex: 1; }
#selectedCurve output { min-width: 3.5em; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
    <nav id="toolbar" aria-label="Tools">
        <button data-tool="select" title="Select" aria-label="Select"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-5.5 1.2L16 19.5l-2.4 1.2-3-6.3L6 18z" fill="currentColor"/></svg></button>
        <button data-tool="pen" title="Pen" aria-label="Pen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l5 9-5 9-5-9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg></button>
        <button data-tool="line" title="Straight line" aria-label="Straight line"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button data-tool="ellipse" title="Ellipse" aria-label="Ellipse"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="8" ry="6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
        <button data-tool="arc" title="Arc" aria-label="Arc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button data-tool="freehand" title="Freehand" aria-label="Freehand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16c3-7 5 3 8-3s5-6 8 1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <div id="newColors" title="The colors of new curves: left, or inside, above; right, or outside, below">
            <input id="newFirst" type="color" aria-label="New curves' left or inside color">
            <input id="newSecond" type="color" aria-label="New curves' right or outside color">
            <button id="swapNewColors" title="Swap" aria-label="Swap the new curves' colors">⇅</button>
        </div>
    </nav>
    <div id="stageScroller">
        <div id="topBar">
            <div id="modelBar" role="group" aria-label="Models">
                <button data-model="biharmonic">Biharmonic</button>
                <button data-model="harmonic">Harmonic</button>
            </div>
        </div>
        <div id="views">
            <figure class="view" data-model="biharmonic">
                <div class="stage">
                    <canvas class="gpu"></canvas>
                    <canvas class="overlay"></canvas>
                </div>
                <figcaption><b>Biharmonic</b><span class="note">A stiff sheet held along the curves: smooth everywhere, as in Finch et al.'s freeform vector graphics.</span></figcaption>
            </figure>
            <figure class="view" data-model="harmonic">
                <div class="stage">
                    <canvas class="gpu"></canvas>
                    <canvas class="overlay"></canvas>
                </div>
                <figcaption><b>Harmonic</b><span class="note">A stretched membrane held along the curves: never overshoots, as in Orzan et al.'s diffusion curves.</span></figcaption>
            </figure>
        </div>
    </div>
    <aside>
        <section>
            <h1>Diffusion Gradient Editor</h1>
            <div class="row">
                <label for="preset">Preset</label>
                <select id="preset"></select>
            </div>
            <div class="row">
                <label>Box</label>
                <input id="width" type="number" min="100" max="2000" step="10" title="Width"> ×
                <input id="height" type="number" min="100" max="2000" step="10" title="Height"> px
            </div>
            <div class="row">
                <label for="space">Interpolate in</label>
                <select id="space">
                    <option value="0">srgb</option>
                    <option value="1">srgb-linear</option>
                    <option value="2">oklab</option>
                </select>
            </div>
            <div class="row" title="How many texels the grid has along its longer side, at most. The grid is never finer than the box's pixels.">
                <label for="resolution">Grid</label>
                <select id="resolution">
                    <option value="128">128</option>
                    <option value="256">256</option>
                    <option value="512">512</option>
                    <option value="1024">1024</option>
                </select>
                <span class="note">texels on the longer side</span>
            </div>
            <div class="row">
                <label><input type="checkbox" id="showCurves" checked> Show the curves</label>
            </div>
            <p id="gpuStatus" class="status"></p>
        </section>

        <section id="selectedCurve" hidden>
            <h2 id="selectedName"></h2>
            <div class="row" title="How firmly the curve holds its colors. Below 100%, the colors around it bleed in. Only the harmonic model takes it for now.">
                <label for="strength">Strength</label>
                <input id="strength" type="range" min="0" max="100" step="1">
                <output id="strengthValue"></output>
            </div>
            <div class="row" title="How wide a band the jump between the curve's two colors is softened over.">
                <label for="blur">Blur</label>
                <input id="blur" type="range" min="0" max="100" step="1">
                <output id="blurValue"></output>
            </div>
        </section>

        <section>
            <h2>Curves</h2>
            <p class="note">Each curve holds a color on each side. For a closed curve, that's inside and outside.</p>
            <p id="toolNote" class="note"></p>
            <div id="curveList"></div>
            <p id="emptyNote" class="note">No curves. Draw some with the tools on the left.</p>
            <div class="row"><button id="clearCurves" class="small">Remove all curves</button></div>
        </section>
    </aside>
</main>
<script>
"use strict";

// MARK: - Color spaces
// Conversions follow WebCore's ColorConversion and CSS Color 4.

const SPACES = ["srgb", "srgb-linear", "display-p3", "a98-rgb", "prophoto-rgb", "rec2020", "xyz-d50", "xyz-d65", "lab", "lch", "oklab", "oklch", "hsl", "hwb"];
const PREDEFINED_SPACES = ["srgb", "srgb-linear", "display-p3", "a98-rgb", "prophoto-rgb", "rec2020", "xyz-d50", "xyz-d65"];
const HUE_INDEX = { hsl: 0, hwb: 0, lch: 2, oklch: 2 };

const M = {
    linSRGBToXYZ: [[506752 / 1228815, 87881 / 245763, 12673 / 70218], [87098 / 409605, 175762 / 245763, 12673 / 175545], [7918 / 409605, 87881 / 737289, 1001167 / 1053270]],
    xyzToLinSRGB: [[12831 / 3959, -329 / 214, -1974 / 3959], [-851781 / 878810, 1648619 / 878810, 36519 / 878810], [705 / 12673, -2585 / 12673, 705 / 667]],
    linP3ToXYZ: [[608311 / 1250200, 189793 / 714400, 198249 / 1000160], [35783 / 156275, 247089 / 357200, 198249 / 2500400], [0, 32229 / 714400, 5220557 / 5000800]],
    xyzToLinP3: [[446124 / 178915, -333277 / 357830, -72051 / 178915], [-14852 / 17905, 63121 / 35810, 423 / 17905], [11844 / 330415, -50337 / 660830, 316169 / 330415]],
    linA98ToXYZ: [[573536 / 994567, 263643 / 1420810, 187206 / 994567], [591459 / 1989134, 6239551 / 9945670, 374412 / 4972835], [53769 / 1989134, 351524 / 4972835, 4929758 / 4972835]],
    xyzToLinA98: [[1829569 / 896150, -506331 / 896150, -308931 / 896150], [-851781 / 878810, 1648619 / 878810, 36519 / 878810], [16779 / 1248040, -147721 / 1248040, 1266979 / 1248040]],
    linProPhotoToXYZD50: [[0.7977666449006423, 0.13518129740053308, 0.0313477341283922], [0.2880748288194013, 0.711835234241873, 0.00008993693872564], [0, 0, 0.8251046025104602]],
    xyzD50ToLinProPhoto: [[1.3457868816471583, -0.25557208737979464, -0.05110186497554526], [-0.5446307051249019, 1.5082477428451468, 0.02052744743642139], [0, 0, 1.2119675456389452]],
    linRec2020ToXYZ: [[63426534 / 99577255, 20160776 / 139408157, 47086771 / 278816314], [26158966 / 99577255, 472592308 / 697040785, 8267143 / 139408157], [0, 19567812 / 697040785, 295819943 / 278816314]],
    xyzToLinRec2020: [[30757411 / 17917100, -6372589 / 17917100, -4539589 / 17917100], [-19765991 / 29648200, 47925759 / 29648200, 467509 / 29648200], [792561 / 44930125, -1921689 / 44930125, 42328811 / 44930125]],
    d65ToD50: [[1.0479297925449969, 0.022946870601609652, -0.05019226628920524], [0.02962780877005599, 0.9904344267538799, -0.017073799063418826], [-0.009243040646204504, 0.015055191490298152, 0.7518742814281371]],
    d50ToD65: [[0.955473421488075, -0.02309845494876471, 0.06325924320057072], [-0.0283697093338637, 1.0099953980813041, 0.021041441191917323], [0.012314014864481998, -0.020507649298898964, 1.330365926242124]],
    xyzToLMS: [[0.8190224379967030, 0.3619062600528904, -0.1288737815209879], [0.0329836539323885, 0.9292868615863434, 0.0361446663506424], [0.0481771893596242, 0.2642395317527308, 0.6335478284694309]],
    lmsToOKLab: [[0.2104542683093140, 0.7936177747023054, -0.0040720430116193], [1.9779985324311684, -2.4285922420485799, 0.4505937096174110], [0.0259040424655478, 0.7827717124575296, -0.8086757549230774]],
    okLabToLMS: [[1, 0.3963377773761749, 0.2158037573099136], [1, -0.1055613458156586, -0.0638541728258133], [1, -0.0894841775298119, -1.2914855480194092]],
    lmsToXYZ: [[1.2268798758459243, -0.5578149944602171, 0.2813910456659647], [-0.0405757452148008, 1.1122868032803170, -0.0717110580655164], [-0.0763729366746601, -0.4214933324022432, 1.5869240198367816]],
};
const D50 = [0.3457 / 0.3585, 1, (1 - 0.3457 - 0.3585) / 0.3585];
const LAB_E = 216 / 24389;
const LAB_K = 24389 / 27;

const mul = (m, v) => [0, 1, 2].map(i => m[i][0] * v[0] + m[i][1] * v[1] + m[i][2] * v[2]);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

function srgbToLinear(c) {
    const a = Math.abs(c);
    return a <= 0.04045 ? c / 12.92 : Math.sign(c) * Math.pow((a + 0.055) / 1.055, 2.4);
}
function srgbFromLinear(c) {
    const a = Math.abs(c);
    return a <= 0.0031308 ? c * 12.92 : Math.sign(c) * (1.055 * Math.pow(a, 1 / 2.4) - 0.055);
}
const powSigned = (c, e) => Math.sign(c) * Math.pow(Math.abs(c), e);
const proPhotoToLinear = c => Math.abs(c) <= 16 / 512 ? c / 16 : powSigned(c, 1.8);
const proPhotoFromLinear = c => Math.abs(c) <= 1 / 512 ? c * 16 : powSigned(c, 1 / 1.8);

function labToXYZD50([L, a, b]) {
    const f1 = (L + 16) / 116;
    const f0 = a / 500 + f1;
    const f2 = f1 - b / 200;
    const x = f0 ** 3 > LAB_E ? f0 ** 3 : (116 * f0 - 16) / LAB_K;
    const y = L > LAB_K * LAB_E ? f1 ** 3 : L / LAB_K;
    const z = f2 ** 3 > LAB_E ? f2 ** 3 : (116 * f2 - 16) / LAB_K;
    return [x * D50[0], y * D50[1], z * D50[2]];
}
function labFromXYZD50(xyz) {
    const f = xyz.map((v, i) => {
        v /= D50[i];
        return v > LAB_E ? Math.cbrt(v) : (LAB_K * v + 16) / 116;
    });
    return [116 * f[1] - 16, 500 * (f[0] - f[1]), 200 * (f[1] - f[2])];
}
function lchToLab([L, C, H]) {
    const h = H * Math.PI / 180;
    return [L, C * Math.cos(h), C * Math.sin(h)];
}
function labToLCH([L, a, b], epsilon) {
    const C = Math.hypot(a, b);
    if (C <= epsilon)
        return [L, 0, NaN];
    const H = Math.atan2(b, a) * 180 / Math.PI;
    return [L, C, H >= 0 ? H : H + 360];
}
function hslToSRGB([h, s, l]) {
    s /= 100;
    l /= 100;
    const a = s * Math.min(l, 1 - l);
    const f = n => {
        const k = (n + h / 30) % 12;
        return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    };
    return [f(0), f(8), f(4)];
}
function srgbToHSL([r, g, b]) {
    const min = Math.min(r, g, b), max = Math.max(r, g, b), d = max - min;
    let hue = NaN, saturation = 0;
    const lightness = (min + max) / 2;
    if (d !== 0) {
        saturation = lightness === 0 || lightness === 1 ? 0 : (max - lightness) / Math.min(lightness, 1 - lightness);
        if (max === r)
            hue = (g - b) / d + (g < b ? 6 : 0);
        else if (max === g)
            hue = (b - r) / d + 2;
        else
            hue = (r - g) / d + 4;
        hue *= 60;
        if (saturation < 0) {
            hue += 180;
            saturation = Math.abs(saturation);
        }
        if (saturation <= 0.001 / 100)
            hue = NaN;
        else if (hue >= 360)
            hue -= 360;
    }
    return [hue, saturation * 100, lightness * 100];
}
function hwbToSRGB([h, w, b]) {
    w /= 100;
    b /= 100;
    if (w + b >= 1) {
        const gray = w / (w + b);
        return [gray, gray, gray];
    }
    return hslToSRGB([h, 100, 50]).map(v => v * (1 - w - b) + w);
}
function srgbToHWB([r, g, b]) {
    const min = Math.min(r, g, b), max = Math.max(r, g, b), d = max - min;
    const whiteness = min, blackness = 1 - max;
    let hue = NaN;
    if (!(d === 0 || whiteness + blackness >= 1 - 0.001 / 100)) {
        if (max === r)
            hue = (g - b) / d + (g < b ? 6 : 0);
        else if (max === g)
            hue = (b - r) / d + 2;
        else
            hue = (r - g) / d + 4;
        hue *= 60;
        if (hue >= 360)
            hue -= 360;
    }
    return [hue, whiteness * 100, blackness * 100];
}

function toXYZ(space, c) {
    switch (space) {
    case "srgb": return mul(M.linSRGBToXYZ, c.map(srgbToLinear));
    case "srgb-linear": return mul(M.linSRGBToXYZ, c);
    case "display-p3": return mul(M.linP3ToXYZ, c.map(srgbToLinear));
    case "a98-rgb": return mul(M.linA98ToXYZ, c.map(v => powSigned(v, 563 / 256)));
    case "prophoto-rgb": return mul(M.d50ToD65, mul(M.linProPhotoToXYZD50, c.map(proPhotoToLinear)));
    case "rec2020": return mul(M.linRec2020ToXYZ, c.map(v => powSigned(v, 2.4)));
    case "xyz-d50": return mul(M.d50ToD65, c);
    case "xyz-d65": return c.slice();
    case "lab": return mul(M.d50ToD65, labToXYZD50(c));
    case "lch": return toXYZ("lab", lchToLab(c));
    case "oklab": return mul(M.lmsToXYZ, mul(M.okLabToLMS, c).map(v => v * v * v));
    case "oklch": return toXYZ("oklab", lchToLab(c));
    case "hsl": return toXYZ("srgb", hslToSRGB(c));
    case "hwb": return toXYZ("srgb", hwbToSRGB(c));
    }
    throw new Error(`Unknown color space ${space}`);
}
function fromXYZ(space, xyz) {
    switch (space) {
    case "srgb": return mul(M.xyzToLinSRGB, xyz).map(srgbFromLinear);
    case "srgb-linear": return mul(M.xyzToLinSRGB, xyz);
    case "display-p3": return mul(M.xyzToLinP3, xyz).map(srgbFromLinear);
    case "a98-rgb": return mul(M.xyzToLinA98, xyz).map(v => powSigned(v, 256 / 563));
    case "prophoto-rgb": return mul(M.xyzD50ToLinProPhoto, mul(M.d65ToD50, xyz)).map(proPhotoFromLinear);
    case "rec2020": return mul(M.xyzToLinRec2020, xyz).map(v => powSigned(v, 1 / 2.4));
    case "xyz-d50": return mul(M.d65ToD50, xyz);
    case "xyz-d65": return xyz.slice();
    case "lab": return labFromXYZD50(mul(M.d65ToD50, xyz));
    case "lch": return labToLCH(fromXYZ("lab", xyz), 0.0015);
    case "oklab": return mul(M.lmsToOKLab, mul(M.xyzToLMS, xyz).map(Math.cbrt));
    case "oklch": return labToLCH(fromXYZ("oklab", xyz), 0.000004);
    case "hsl": return srgbToHSL(fromXYZ("srgb", xyz));
    case "hwb": return srgbToHWB(fromXYZ("srgb", xyz));

}

function categories(space) {
    switch (space) {
    case "lab": case "oklab": return ["lightness", "opponentA", "opponentB"];
    case "lch": case "oklch": return ["lightness", "colorfulness", "hue"];
    case "hsl": return ["hue", "colorfulness", "lightness"];
    case "hwb": return ["hue", null, null];
    default: return ["reds", "greens", "blues"];
    }

// Converts, then carries missing components forward to analogous ones, like convertColorCarryingForwardMissing().
// Missing components are NaN.
function convertColor(from, coords, to, carryForward) {
    if (from === to)
        return coords.slice();
    const output = fromXYZ(to, toXYZ(from, coords.map(v => Number.isNaN(v) ? 0 : v)));
    if (!carryForward)
        return output;
    const inputCategories = categories(from);
    const outputCategories = categories(to);
    const analogInOutput = i => inputCategories[i] ? outputCategories.indexOf(inputCategories[i]) : -1;
    const analogInInput = j => outputCategories[j] ? inputCategories.indexOf(outputCategories[j]) : -1;
    const unmatched = [0, 1, 2].filter(i => analogInOutput(i) < 0);
    if (unmatched.length && unmatched.every(i => Number.isNaN(coords[i]))) {
        for (let j = 0; j < 3; ++j) {
            if (analogInInput(j) < 0)
                output[j] = NaN;
        }
    }
    for (let i = 0; i < 3; ++i) {
        if (Number.isNaN(coords[i]) && analogInOutput(i) >= 0)
            output[analogInOutput(i)] = NaN;
    }
    return output;
}

// MARK: - Color parsing
// Returns { space, c: [3 components, NaN if missing], alpha, eightBit, resolvedByBrowser }.

const NUMBER = /^([+-]?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?)(%|deg|rad|grad|turn)?$/i;

function parseToken(token) {
    if (token === "none")
        return { none: true };
    const match = NUMBER.exec(token);
    if (!match)
        return null;
    return { n: parseFloat(match[1]), unit: match[2]?.toLowerCase() ?? "" };
}
const valueOf = (token, percentScale) => token.none ? NaN : token.unit === "%" ? token.n * percentScale : token.n;
function hueOf(token) {
    if (token.none)
        return NaN;
    switch (token.unit) {
    case "rad": return token.n * 180 / Math.PI;
    case "grad": return token.n * 0.9;
    case "turn": return token.n * 360;
    default: return token.n;
    }
}

function parseColorFunction(name, body) {
    if (/[()]/.test(body) || /\bfrom\b/.test(body))
        return null;
    let parts, alphaToken;
    const legacy = body.includes(",");
    if (legacy) {
        parts = body.split(",").map(s => s.trim());
        if (parts.length === 4)
            alphaToken = parts.pop();
    } else {
        const slashParts = body.split("/");
        if (slashParts.length > 2)
            return null;
        parts = slashParts[0].trim().split(/\s+/);
        alphaToken = slashParts[1]?.trim();
    }
    let space = null;
    if (name === "color") {
        space = parts.shift();
        if (space === "xyz")
            space = "xyz-d65";
        if (!PREDEFINED_SPACES.includes(space))
            return null;
    }
    if (parts.length !== 3)
        return null;
    const tokens = parts.map(parseToken);
    if (tokens.some(t => !t))
        return null;
    let alpha = 1;
    if (alphaToken !== undefined) {
        const token = parseToken(alphaToken);
        if (!token)
            return null;
        alpha = token.none ? NaN : clamp(valueOf(token, 1 / 100), 0, 1);
    }
    let c;
    let eightBitCandidate = false;
    switch (name) {
    case "rgb": case "rgba":
        space = "srgb";
        c = tokens.map(t => t.none ? NaN : clamp(t.unit === "%" ? t.n / 100 : t.n / 255, 0, 1));
        eightBitCandidate = true;
        break;
    case "hsl": case "hsla":
        space = "hsl";
        c = [hueOf(tokens[0]), valueOf(tokens[1], 1), valueOf(tokens[2], 1)];
        if (!Number.isNaN(c[1]))
            c[1] = Math.max(0, c[1]);
        eightBitCandidate = !(c[1] > 100 || c[2] < 0 || c[2] > 100);
        break;
    case "hwb":
        space = "hwb";
        c = [hueOf(tokens[0]), valueOf(tokens[1], 1), valueOf(tokens[2], 1)];
        eightBitCandidate = !(c[1] < 0 || c[1] > 100 || c[2] < 0 || c[2] > 100);
        break;
    case "lab":
        space = "lab";
        c = [valueOf(tokens[0], 1), valueOf(tokens[1], 1.25), valueOf(tokens[2], 1.25)];
        if (!Number.isNaN(c[0]))
            c[0] = clamp(c[0], 0, 100);
        break;
    case "lch":
        space = "lch";
        c = [valueOf(tokens[0], 1), valueOf(tokens[1], 1.5), hueOf(tokens[2])];
        if (!Number.isNaN(c[0]))
            c[0] = clamp(c[0], 0, 100);
        if (!Number.isNaN(c[1]))
            c[1] = Math.max(0, c[1]);
        break;
    case "oklab":
        space = "oklab";
        c = [valueOf(tokens[0], 1 / 100), valueOf(tokens[1], 0.004), valueOf(tokens[2], 0.004)];
        if (!Number.isNaN(c[0]))
            c[0] = clamp(c[0], 0, 1);
        break;
    case "oklch":
        space = "oklch";
        c = [valueOf(tokens[0], 1 / 100), valueOf(tokens[1], 0.004), hueOf(tokens[2])];
        if (!Number.isNaN(c[0]))
            c[0] = clamp(c[0], 0, 1);
        if (!Number.isNaN(c[1]))
            c[1] = Math.max(0, c[1]);
        break;
    case "color":
        c = tokens.map(t => valueOf(t, 1 / 100));
        break;
    default:
        return null;
    }
    // Like WebCore, rgb(), hsl() and hwb() without missing components and within the sRGB gamut are stored as 8-bit sRGB.
    if (eightBitCandidate && !c.some(Number.isNaN) && !Number.isNaN(alpha))
        return eightBitColor(convertColor(space, c, "srgb", false), alpha);
    return { space, c, alpha, eightBit: false };
}

function eightBitColor(srgb, alpha) {
    const quantize = v => Math.round(clamp(v, 0, 1) * 255) / 255;
    return { space: "srgb", c: srgb.map(quantize), alpha: quantize(alpha), eightBit: true };
}

let colorProbe = null;
const colorCache = new Map();

function parseColor(text) {
    const key = text.trim().toLowerCase();
    if (colorCache.has(key))
        return colorCache.get(key);
    const result = parseColorUncached(key);
    colorCache.set(key, result);
    return result;
}

function parseColorUncached(text) {
    if (!text || !CSS.supports("color", text))
        return null;
    const hex = /^#([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/.exec(text);
    if (hex) {
        let digits = hex[1];
        if (digits.length <= 4)
            digits = [...digits].map(d => d + d).join("");
        const bytes = digits.match(/../g).map(h => parseInt(h, 16) / 255);
        return { space: "srgb", c: bytes.slice(0, 3), alpha: bytes[3] ?? 1, eightBit: true };
    }
    const fn = /^([a-z]+)\((.*)\)$/s.exec(text);
    if (fn) {
        const parsed = parseColorFunction(fn[1], fn[2].trim());
        if (parsed)
            return parsed;
    }
    // Keywords and anything else this parser doesn't read: let the browser resolve it.
    if (!colorProbe) {
        colorProbe = document.createElement("div");
        colorProbe.style.display = "none";
        document.body.append(colorProbe);
    }
    colorProbe.style.color = "";
    colorProbe.style.color = text;
    const computed = getComputedStyle(colorProbe).color.toLowerCase();
    const inner = /^([a-z]+)\((.*)\)$/s.exec(computed);
    const parsed = inner && parseColorFunction(inner[1], inner[2].trim());
    if (!parsed)
        return null;
    // A plain keyword is an 8-bit color in WebCore. Anything else is resolved by this browser, so it may differ.
    parsed.resolvedByBrowser = !/^[a-z]+$/.test(text) || text === "currentcolor";
    return parsed;
}

const BLACK = { space: "srgb", c: [0, 0, 0], alpha: 1, eightBit: true };

function toOutput(color, outputSpace) {
    const xyz = toXYZ(color.space, color.c.map(v => Number.isNaN(v) ? 0 : v));
    const rgb = fromXYZ(outputSpace, xyz).map(v => clamp(v, 0, 1));
    return [...rgb, Number.isNaN(color.alpha) ? 0 : color.alpha];
}

function hexForColor(color) {
    return "#" + toOutput(color, "srgb").slice(0, 3).map(v => Math.round(v * 255).toString(16).padStart(2, "0")).join("");
}


// MARK: - Renderer

// MeshShader2's WebGPU freeform gradient renderer: its constraint rasterizer, harmonic and biharmonic multigrids,
// and the sharp edges drawn along two-sided lines. See tools/diffusion-gradient-editor/vendor/README.md.
// Draws a freeform gradient with WebGPU: the browser side of the
// FreeformGradient package's WebGPU renderer, a port of its Metal renderer:
// the solver's harmonic and biharmonic multigrids, and the sharp edges drawn
// over two-sided lines. It is given the WGSL in WebGPUFreeformGradient.wgsl and a
// gradient as WebGPUFreeformGradient.GradientData encodes it, solves it for
// the size of whatever it draws into, and draws into any texture view of the
// format it was made for. Its readPixels needs readTexturePixels, from the
// WebGPUHost package's script, which pages inline before it.
//
//   const renderer = new WebGPUFreeformGradientRenderer(device, { shader, format: "bgra8unorm" });
//   renderer.setGradient(gradient);
//   const encoder = device.createCommandEncoder();
//   renderer.encode(encoder, context.getCurrentTexture().createView(), canvas.width, canvas.height);
//   device.queue.submit([encoder.finish()]);

// What the Metal solver's harmonic multigrid does, in the same numbers: see
// FreeformGradientSolver.swift.
const preSmoothing = 2;
const postSmoothing = 2;
const smallLevelSmoothing = 8;
const coarsestSmoothing = 500;
const finestCycles = 2;
const twoSidedCycles = 2;
const harmonicOmega = 0.9;
// A two-sided segment is never thinner than this many texels of the finest
// level: FreeformGradientDescriptor.twoSidedTexels.
const twoSidedTexels = 1.5;
// Levels of no more than this many texels take all their smoothing steps in
// one dispatch, as many as the device allows: the Metal solver's
// smallLevelTexels.
const maximumSmallLevelTexels = 1024;

// What the Metal solver's biharmonic does, settled as its images are.
const biharmonicOmega = 0.55;
const biharmonicSmoothing = 4;
const galerkinSmoothing = 4;
const biharmonicCycles = 1;
const finestBiharmonicCycles = 16;
const twoSidedBiharmonicCycles = 4;
const conjugateGradientSmoothing = 2;
// The coarsest level's inverse, n × n with n up to 64, then each row's scale.
const coarsestTexels = 64;
// Partial sums of a dot product, one a workgroup of 16×16 texels, over a
// 2048-texel grid.
const maximumPartialSums = (2048 / 16) * (2048 / 16);
// What a level's Galerkin coefficients take: 25 coefficients, whether the row
// is free, its magnitude, its sum, and whether it is the background.
const coefficientSlices = 29;

// How far beyond where a two-sided line holds its colors its strips blend
// into the solution, in finest texels: the Metal renderer's edgeBlendTexels.
const edgeBlendTexels = 1.5;

const fround = Math.fround;

// The rows of the Galerkin levels below a level's own equation where no point
// and no edge reaches: the 13-point stencil's Pᵀ K P / 4 on an unbounded
// grid, and that of each in turn, 25 numbers a row, as the Metal solver's
// backgroundRows.
function backgroundRows() {
  let stencil = new Map();
  const key = (x, y) => `${x},${y}`;
  for (const [x, y, c] of [
    [0, 0, 20], [-1, 0, -8], [1, 0, -8], [0, -1, -8], [0, 1, -8],
    [-1, -1, 2], [1, -1, 2], [-1, 1, 2], [1, 1, 2], [-2, 0, 1], [2, 0, 1], [0, -2, 1], [0, 2, 1],
  ]) {
    stencil.set(key(x, y), { x, y, c });
  }
  const corners = (i) => {
    const x = 0.5 * i - 0.25;
    const base = Math.floor(x);
    return [[base, 1 - (x - base)], [base + 1, x - base]];
  };
  const fromOrigin = [[-1, 0.25], [0, 0.75], [1, 0.75], [2, 0.25]];
  const rows = [];
  for (let level = 0; level < 16; level++) {
    const coarse = new Map();
    for (const [ix, wx] of fromOrigin) {
      for (const [iy, wy] of fromOrigin) {
        for (const { x, y, c } of stencil.values()) {
          for (const [jx, vx] of corners(ix + x)) {
            for (const [jy, vy] of corners(iy + y)) {
              const k = key(jx, jy);
              const entry = coarse.get(k) ?? { x: jx, y: jy, c: 0 };
              entry.c += 0.25 * wx * wy * c * vx * vy;
              coarse.set(k, entry);
            }
          }
        }
      }
    }
    stencil = coarse;
    for (let o = 0; o < 25; o++) {
      rows.push(coarse.get(key(o % 5 - 2, Math.floor(o / 5) - 2))?.c ?? 0);
    }
  }
  return new Float32Array(rows);
}

// Each Chebyshev step's weights, toward eigenvalues in [1/16, 1] of a level
// scaled so that none is larger than 1, in 32-bit floats as the Metal solver
// works them out.
function chebyshevSteps(count) {
  const low = fround(1 / 16), high = 1;
  const gamma = fround(2 / fround(low + high));
  const sigma = fround(fround(high - low) / fround(high + low));
  const steps = [];
  let omega = 1;
  for (let index = 0; index < count; index++) {
    if (index === 1) {
      omega = fround(1 / fround(1 - fround(fround(sigma * sigma) / 2)));
    } else if (index > 1) {
      omega = fround(1 / fround(1 - fround(fround(fround(sigma * sigma) * omega) / 4)));
    }
    steps.push({ omega, gamma });
  }
  return steps;
}

// The index of a grid's texture that is neither of two others.
function spare(a, b) {
  return [0, 1, 2].find((i) => i !== a && i !== b);
}

// Textures of a level, so a step reads one and writes another: two, and a
// third for the biharmonic's Chebyshev steps, which also read the one before.
// The same as the Metal solver's Grid.
class Grid {
  constructor(textures) {
    this.textures = textures;
    this.current = 0;
  }
  // What the last step wrote.
  get texture() { return this.textures[this.current]; }
  // What the next step writes.
  get next() { return this.textures[this.current === 0 ? 1 : 0]; }
  flip() { this.current = this.current === 0 ? 1 : 0; }
}

// A level's uniforms, 64 bytes, in slots this far apart.
const uniformSlotBytes = 256;
const uniformSlots = 1024;

class WebGPUFreeformGradientRenderer {
  // The pipelines do not depend on the gradient, so they are made once. The
  // display pass writes encoded sRGB, for a unorm format: bgra8unorm, as the
  // Metal renderer's view is.
  constructor(device, { shader, format }) {
    this.device = device;
    this.format = format;
    const limits = device.limits;
    // As many texels as one workgroup can hold, two copies of each. Pages ask
    // for the device's own limits, so it is the Metal solver's 1024 on a Mac.
    this.smallLevelTexels = Math.max(1, Math.min(
      maximumSmallLevelTexels,
      limits.maxComputeInvocationsPerWorkgroup,
      limits.maxComputeWorkgroupSizeX,
      Math.floor(limits.maxComputeWorkgroupStorageSize / 32)));

    const module = device.createShaderModule({ code: shader });
    const compute = (entryPoint, constants) => device.createComputePipeline({
      layout: "auto", compute: { module, entryPoint, constants },
    });
